<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Wotaku → AnymeX</title>

<style>
body{
  margin:0;
  background:#0b0b0f;
  color:#f5f5f7;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;
  padding:24px 16px;
}

main{
  max-width:760px;
  margin:auto;
}

h1{
  font-size:27px;
  margin:0 0 6px;
}

p{
  color:#9b9ba3;
  line-height:1.45;
}

.status{
  margin:16px 0;
  padding:12px;
  border:1px solid #292931;
  border-radius:12px;
  color:#aaa;
}

.repo{
  background:#15151b;
  border:1px solid #292931;
  border-radius:16px;
  padding:15px;
  margin:10px 0;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.name{
  font-size:17px;
  font-weight:650;
}

.kind{
  display:inline-block;
  margin-top:9px;
  margin-right:6px;
  padding:5px 8px;
  border-radius:8px;
  background:#24242c;
  color:#aaa;
  font-size:12px;
}

.btn{
  display:inline-block;
  background:#fff;
  color:#08080a;
  text-decoration:none;
  font-weight:650;
  border-radius:11px;
  padding:10px 13px;
  white-space:nowrap;
}

.sub{
  font-size:11px;
  color:#70707a;
  word-break:break-all;
  margin-top:8px;
}

.error{
  color:#ff8d8d;
  border-color:#542626;
}

@media(max-width:600px){
  .row{
    align-items:flex-start;
    flex-direction:column;
  }

  .btn{
    width:100%;
    text-align:center;
    padding:12px 0;
  }
}
</style>
</head>

<body>

<main>

<h1>Wotaku → AnymeX</h1>

<p>
This page asks the server for the current repositories listed by Wotaku,
then creates AnymeX handoff links for the discovered indexes.
</p>

<div id="status" class="status">
Loading current repositories…
</div>

<div id="repos"></div>

</main>

<script>

const API =
  "https://workerz.youngengolden.workers.dev/api/repos";


function addLink(url){

  return "anymex://add-repo?url=" +
    encodeURIComponent(url);

}


function esc(value){

  return String(value).replace(
    /[&<>"']/g,
    function(char){
      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[char];
    }
  );

}


async function load(){

  const status =
    document.querySelector("#status");

  const box =
    document.querySelector("#repos");


  try{

    const response =
      await fetch(API,{
        method:"GET",
        cache:"no-store",
        headers:{
          "Accept":"application/json"
        }
      });


    if(!response.ok){

      throw new Error(
        "API returned HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if(!data || !Array.isArray(data.repos)){

      throw new Error(
        "Invalid API response"
      );

    }


    const repositories =
      data.repos.filter(
        repo =>
          repo &&
          Array.isArray(repo.indexes) &&
          repo.indexes.length > 0
      );


    if(repositories.length === 0){

      status.textContent =
        "The API responded, but no repositories were found.";

      return;

    }


    box.innerHTML =
      repositories.map(function(repo){

        const indexes =
          repo.indexes.map(function(index){

            if(!index || !index.url){
              return "";
            }


            return `
              <div style="margin-top:12px">

                <span class="kind">
                  ${esc(index.type || "Repository")}
                </span>

                <a
                  class="btn"
                  href="${addLink(index.url)}"
                >
                  Add to AnymeX
                </a>

                <div class="sub">
                  ${esc(index.url)}
                </div>

              </div>
            `;

          }).join("");


        const firstIndex =
          repo.indexes.find(
            index => index && index.url
          );


        const mainButton =
          firstIndex
            ? `
              <a
                class="btn"
                href="${addLink(firstIndex.url)}"
              >
                Add to AnymeX
              </a>
            `
            : "";


        return `
          <section class="repo">

            <div class="row">

              <div class="name">
                ${esc(repo.name || repo.repo || "Repository")}
              </div>

              ${mainButton}

            </div>

            ${indexes}

          </section>
        `;

      }).join("");


    status.textContent =
      `Loaded ${repositories.length} repositories from Wotaku.`;


  }catch(error){

    console.error(
      "Wotaku API error:",
      error
    );


    status.classList.add("error");

    status.innerHTML =
      `
      Could not load the Wotaku feed.

      <br><br>

      <small>
        ${esc(error.message)}
      </small>
      `;

  }

}


load();

</script>

</body>
</html>
